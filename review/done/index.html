<!-- BATCH H2 item 4: where the report-review function sends the browser
     after the button on /review/. It is told only a result code, the kind of
     thing and its owner's handle - the words are this page's own, so nobody
     can make the site show something made up. -->
<h1 id="title">done</h1>
<p class="ask" id="said">that link doesn&rsquo;t work. use the newest report email, or change it in the dashboard.</p>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var r = q.get('r') || '';
    var k = q.get('k') || '';
    var o = q.get('o') || '';
    var owner = /^[a-z0-9._]{1,30}$/.test(o) ? '@' + o : 'its owner';
    var labels = { route: 'route', walk: 'walk', comment: 'comment', album: 'album' };
    var thing = k === 'person' ? owner + '\u2019s profile and everything of theirs' : owner + '\u2019s ' + (labels[k] || 'post');
    var words = {
      hidden: ['hidden.', thing + ' is now hidden from everyone but ' + owner + '. to show it again, tap \u201cun-hide it\u201d in the same email.'],
      shown: ['shown again.', 'everyone can see ' + thing + ' again. it only hides by itself again if 3 new people report it.'],
      'not-hideable': ['nothing to hide.', 'a stop\u2019s hours report hides nothing - change the hours on the route instead.'],
      limited: ['too many tries.', 'try again in an hour.'],
      error: ['not done.', 'that couldn\u2019t be done just now. go back and tap the button again.'],
    };
    var said = words[r];
    if (!said) return;
    document.getElementById('title').textContent = said[0];
    document.getElementById('said').textContent = said[1];
  })();
</script>
